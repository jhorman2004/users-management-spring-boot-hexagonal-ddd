# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}
# Secretos locales (ignorados por git). Se busca en el directorio actual y en la raíz del repo,
# para que funcione al arrancar desde la raíz o desde la carpeta users-service.
spring.config.import=optional:file:./.environments/application-secrets.properties,optional:file:../.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Kafka: los correos los envía notifier-service (local: PLAINTEXT. En Render: perfil "cloud",
# ver application-cloud.properties)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Si Kafka no responde, falla rápido en vez de bloquear la petición HTTP 60 s
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}
notifications.topic=${NOTIFICATIONS_TOPIC:notifications.email}
# Solo Render gratis: URL del health check de notifier-service para despertarlo tras publicar
# (p. ej. https://notifier-service-xxxx.onrender.com/actuator/health). Vacía = no hace nada.
notifier.wake-up-url=${NOTIFIER_WAKEUP_URL:}

# =============================================
# accounts-service (paso 5: HTTP síncrono). INTERNAL_API_KEY es obligatoria y debe ser la misma
# que en accounts-service. En Render subir ACCOUNTS_READ_TIMEOUT (~70s) por el arranque en frío.
# =============================================
accounts.base-url=${ACCOUNTS_BASE_URL:http://localhost:8081}
accounts.api-key=${INTERNAL_API_KEY:}
accounts.timeout.connect=${ACCOUNTS_CONNECT_TIMEOUT:2s}
accounts.timeout.read=${ACCOUNTS_READ_TIMEOUT:5s}
accounts.retry.max-attempts=${ACCOUNTS_RETRY_MAX_ATTEMPTS:3}
accounts.retry.initial-delay=${ACCOUNTS_RETRY_INITIAL_DELAY:300ms}
accounts.retry.multiplier=${ACCOUNTS_RETRY_MULTIPLIER:2.0}
accounts.circuit-breaker.failure-rate-threshold=${ACCOUNTS_CIRCUIT_FAILURE_THRESHOLD:50}
accounts.circuit-breaker.sliding-window-size=${ACCOUNTS_CIRCUIT_WINDOW_SIZE:10}
accounts.circuit-breaker.minimum-calls=${ACCOUNTS_CIRCUIT_MINIMUM_CALLS:5}
accounts.circuit-breaker.open-duration=${ACCOUNTS_CIRCUIT_OPEN_DURATION:30s}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
