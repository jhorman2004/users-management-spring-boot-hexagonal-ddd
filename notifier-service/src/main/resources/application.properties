# =============================================
# Spring Boot — microservicio notifiers
# =============================================
spring.application.name=notifier-service
server.port=${PORT:8082}
# Secretos locales (ignorados por git), en la carpeta actual o en la raíz del repo.
spring.config.import=optional:file:./.environments/notifier-secrets.properties,optional:file:../.environments/notifier-secrets.properties

# Solo el health check (Render lo usa para saber si el servicio está vivo)
management.endpoints.web.exposure.include=health

# =============================================
# Kafka (local: PLAINTEXT. En Render: perfil "cloud", ver application-cloud.properties)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notifier-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

notifications.topic=${NOTIFICATIONS_TOPIC:notifications.email}
notifications.dlt-topic=${NOTIFICATIONS_DLT_TOPIC:notifications.email.DLT}
notifications.create-topics=${NOTIFICATIONS_CREATE_TOPICS:true}
notifications.retry.attempts=${NOTIFICATIONS_RETRY_ATTEMPTS:2}
notifications.retry.interval=${NOTIFICATIONS_RETRY_INTERVAL:2s}
notifications.idempotency.cache-size=${NOTIFICATIONS_IDEMPOTENCY_CACHE_SIZE:10000}

# =============================================
# API transaccional de Brevo (no se usa con el perfil "local")
# =============================================
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
brevo.timeout.connect=${BREVO_CONNECT_TIMEOUT:2s}
brevo.timeout.read=${BREVO_READ_TIMEOUT:5s}
brevo.retry.max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry.initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry.multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-breaker.failure-rate-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-breaker.sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-breaker.minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-breaker.open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}
