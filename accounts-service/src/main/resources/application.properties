# =============================================
# Spring Boot — microservicio accounts
# =============================================
spring.application.name=accounts-service
server.port=${PORT:8081}
# Secretos locales (ignorados por git), en la carpeta actual o en la raíz del repo.
spring.config.import=optional:file:./.environments/accounts-secrets.properties,optional:file:../.environments/accounts-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Solo el health check (Render lo usa para saber si el servicio está vivo)
management.endpoints.web.exposure.include=health

# =============================================
# Base de datos de cuentas (MySQL local / TiDB en la nube)
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_cuentas}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Clave compartida con users-service (header X-Internal-Api-Key). Obligatoria, sin valor por defecto.
# =============================================
internal.api-key=${INTERNAL_API_KEY:}

# =============================================
# Kafka (local: PLAINTEXT. En Render: perfil "cloud", ver application-cloud.properties)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Si Kafka no responde, falla rápido en vez de bloquear la petición HTTP 60 s
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}
notifications.topic=${NOTIFICATIONS_TOPIC:notifications.email}
